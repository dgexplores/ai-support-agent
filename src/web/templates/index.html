<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aster & Row — AI Support Agent</title>
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #111128;
            --bg-tertiary: #1a1a35;
            --border: #252550;
            --border-hover: #35356a;
            --text-primary: #e8e8f0;
            --text-secondary: #9090b0;
            --text-muted: #606080;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --user-bg: linear-gradient(135deg, #6366f1, #8b5cf6);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(12px);
            position: relative;
            z-index: 10;
        }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .header .logo {
            font-size: 28px;
            background: linear-gradient(135deg, #f59e0b, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(249, 115, 22, 0.3));
        }
        .header h1 { font-size: 17px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
        .header .subtitle { font-size: 11px; color: var(--text-muted); margin-top: 1px; letter-spacing: 0.5px; text-transform: uppercase; }
        .header-right { display: flex; gap: 10px; align-items: center; }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%; background: var(--success);
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5); animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .status-text { font-size: 11px; color: var(--success); }
        .header button {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .header button:hover { background: var(--border); color: var(--text-primary); border-color: var(--border-hover); }

        /* Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            scroll-behavior: smooth;
        }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* Messages */
        .message {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-items: flex-end; }
        .message.assistant { align-items: flex-start; }
        .message .label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
            padding: 0 4px;
        }
        .message.user .label { color: var(--accent); }
        .message.assistant .label { color: var(--text-muted); }
        .message .bubble {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.65;
            font-size: 14px;
            word-wrap: break-word;
        }
        .message.user .bubble {
            background: var(--user-bg);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
        }
        .message.assistant .bubble {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }
        .message.assistant .bubble strong { color: #fff; font-weight: 600; }
        .message.assistant .bubble em { color: var(--text-secondary); font-style: italic; }

        /* Sources */
        .sources {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
            padding: 0 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .source-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            transition: all 0.2s;
        }
        .source-tag:hover { border-color: var(--accent); color: var(--accent); }

        /* Handoff Badge */
        .handoff-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(245, 158, 11, 0.08);
            color: var(--warning);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            margin-top: 10px;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        /* Tool Indicator */
        .tool-indicator {
            font-size: 12px;
            color: var(--accent);
            margin: 4px 0 6px 4px;
            padding: 6px 14px;
            background: var(--accent-glow);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            animation: slideIn 0.3s ease;
        }
        .tool-indicator .spinner {
            width: 12px; height: 12px;
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Typing Indicator */
        .typing {
            display: none;
            padding: 10px 24px;
            color: var(--text-muted);
            font-size: 13px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .typing.active { display: flex; align-items: center; gap: 10px; }
        .typing .dots { display: flex; gap: 5px; }
        .typing .dot {
            width: 7px; height: 7px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite;
        }
        .typing .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-8px); opacity: 1; } }

        /* Welcome */
        .welcome {
            text-align: center;
            padding: 80px 20px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .welcome .icon { font-size: 56px; margin-bottom: 20px; filter: drop-shadow(0 4px 8px rgba(249, 115, 22, 0.3)); }
        .welcome h2 { font-size: 22px; color: #fff; margin-bottom: 10px; font-weight: 700; }
        .welcome p { font-size: 14px; color: var(--text-secondary); max-width: 440px; margin: 0 auto; line-height: 1.7; }
        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 28px;
        }
        .suggestion {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .suggestion:hover {
            border-color: var(--accent);
            color: var(--text-primary);
            background: var(--accent-glow);
            transform: translateY(-1px);
        }

        /* Input Area */
        .input-area {
            background: var(--bg-secondary);
            padding: 16px 24px;
            border-top: 1px solid var(--border);
        }
        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .input-wrapper input {
            flex: 1;
            padding: 14px 18px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 14px;
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.25s;
        }
        .input-wrapper input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .input-wrapper input::placeholder { color: var(--text-muted); }
        .input-wrapper button {
            background: var(--user-bg);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .input-wrapper button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4); }
        .input-wrapper button:disabled { background: var(--bg-tertiary); cursor: not-allowed; color: var(--text-muted); box-shadow: none; transform: none; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <span class="logo">🎒</span>
            <div>
                <h1>Aster & Row</h1>
                <div class="subtitle">AI Support Agent</div>
            </div>
        </div>
        <div class="header-right">
            <div class="status-dot"></div>
            <span class="status-text">Online</span>
            <button onclick="newSession()">✦ New Chat</button>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="welcome" id="welcome">
            <div class="icon">🎒</div>
            <h2>How can I help you today?</h2>
            <p>I'm Aster & Row's AI assistant. I can help with orders, returns, shipping, warranties, and product information.</p>
            <div class="suggestions">
                <div class="suggestion" onclick="quickAsk('How long do I have to return an unused backpack?')">📦 Return policy</div>
                <div class="suggestion" onclick="quickAsk('Where is order ORD-1007?')">🔍 Track order</div>
                <div class="suggestion" onclick="quickAsk('Do you ship internationally?')">🌍 Shipping info</div>
                <div class="suggestion" onclick="quickAsk('What is the warranty on bags?')">🛡️ Warranty</div>
            </div>
        </div>
    </div>

    <div class="typing" id="typing">
        <div class="dots">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <span>Thinking...</span>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="messageInput" placeholder="Ask about orders, returns, shipping..."
                   onkeypress="if(event.key==='Enter')sendMessage()" autofocus>
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let sessionId = null;

        async function newSession() {
            const res = await fetch('/api/session/new', { method: 'POST' });
            const data = await res.json();
            sessionId = data.session_id;
            document.getElementById('chatContainer').innerHTML = `
                <div class="welcome" id="welcome">
                    <div class="icon">🎒</div>
                    <h2>How can I help you today?</h2>
                    <p>I'm Aster & Row's AI assistant. I can help with orders, returns, shipping, warranties, and product information.</p>
                    <div class="suggestions">
                        <div class="suggestion" onclick="quickAsk('How long do I have to return an unused backpack?')">📦 Return policy</div>
                        <div class="suggestion" onclick="quickAsk('Where is order ORD-1007?')">🔍 Track order</div>
                        <div class="suggestion" onclick="quickAsk('Do you ship internationally?')">🌍 Shipping info</div>
                        <div class="suggestion" onclick="quickAsk('What is the warranty on bags?')">🛡️ Warranty</div>
                    </div>
                </div>`;
        }

        function quickAsk(question) {
            document.getElementById('messageInput').value = question;
            sendMessage();
        }

        function formatMarkdown(text) {
            let html = escapeHtml(text);
            // Bold
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            // Italic
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
            // Line breaks
            html = html.replace(/\n/g, '<br>');
            return html;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            const welcome = document.getElementById('welcome');
            if (welcome) welcome.remove();

            input.value = '';
            addMessage('user', message);

            document.getElementById('typing').classList.add('active');
            document.getElementById('sendBtn').disabled = true;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, session_id: sessionId }),
                });
                const data = await res.json();
                sessionId = data.session_id;

                if (data.tool_calls && data.tool_calls.length > 0) {
                    for (const tc of data.tool_calls) {
                        addToolCall(tc);
                    }
                }

                addMessage('assistant', data.response, data.sources, data.handoff);
            } catch (err) {
                addMessage('assistant', 'Sorry, something went wrong. Please try again.');
            }

            document.getElementById('typing').classList.remove('active');
            document.getElementById('sendBtn').disabled = false;
            input.focus();
        }

        function addMessage(role, content, sources = [], handoff = false) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = `message ${role}`;

            const labelText = role === 'user' ? 'You' : 'Agent';

            let html = `<div class="label">${labelText}</div>`;
            html += `<div class="bubble">${formatMarkdown(content)}</div>`;

            if (sources && sources.length > 0) {
                html += `<div class="sources">${sources.map(s => `<span class="source-tag">📄 ${escapeHtml(s)}</span>`).join('')}</div>`;
            }

            if (handoff) {
                html += `<div class="handoff-badge">💬 I recommend contacting our support team for further assistance.</div>`;
            }

            div.innerHTML = html;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addToolCall(toolName) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = 'tool-indicator';
            div.innerHTML = `<div class="spinner"></div> Looking up order information...`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        newSession();
    </script>
</body>
</html>
